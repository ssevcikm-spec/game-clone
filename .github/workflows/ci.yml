# CI - brány a testy (docs/08 §8.2, §8.4).
#
# Poznámka pro člověka: tenhle soubor vlastní bootstrap granule `boot.gates`
# a granule do něj nesmí zasahovat (docs/07 §7.1.5).
#
# UNVERIFIED (2026-10-02): workflow se na této stanici NEDÁ spustit - repo nemá
# remote ani GitHub běžce. Ověřeno lokálně je jen to, co jde: `run-all.py`
# včetně self-testů všech bran, `ci-godot.sh` (syntaxe) a to, že každá brána má
# nenulový počet měřených objektů. Ověřit při prvním běhu: přesná URL a SHA-256
# linuxového Godotu 4.7.2 (záměrně tu není vymyšlené číslo) a chování
# `--write-movie` v CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_BIN: ${{ github.workspace }}/.cache/godot/godot
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Závislosti bran (Pillow, numpy)
        run: python -m pip install --disable-pip-version-check Pillow numpy

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p .cache/godot
          # UNVERIFIED: URL i kontrolní součet je potřeba ověřit při prvním běhu
          # (docs/11 §11.6 - otevřené otázky). Verze musí odpovídat docs/02 §2.1.
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d .cache/godot
          mv ".cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --version

      - name: Důkaz, že brány umí selhat (self-testy)
        env:
          GODOT: ${{ env.GODOT_BIN }}
        run: python tools/gates/run-all.py --self-test

      # POZOR: dvojtečka s mezerou uvnitř NEUVOZOVKOVANÉHO jména kroku je
      # neplatný YAML ("mapping values are not allowed here"). GitHub kvůli ní
      # odmítl běhy #1-#9 hláškou "Invalid workflow file: ci.yml#L56 / You have
      # an error in your yaml syntax on line 56" (ověřeno 2026-10-06 z UI).
      # POZOR: tomuhle kroku chybel `env: GODOT` - skript `ci-godot.sh` cte
      # `GODOT`, ale workflow ma promennou `GODOT_BIN`, takze se pouzilo holé
      # `godot` a krok spadl na "command not found" (127). NamEReno 2026-10-06
      # v behu #10 - poprve, kdy se workflow vubec spustil.
      - name: "Godot: import, testy, snímek (boot.ci_env)"
        env:
          GODOT: ${{ env.GODOT_BIN }}
        run: bash tools/gates/ci-godot.sh .

      # `run-all.py` vraci 2, kdyz neco zustalo NEMERENO (docs/08 §8.2). V CI bez
      # `assets/uo` (jsou v .gitignore) to plati pro G6 a G10 - a NENI to vada
      # kódu, takze krok NESMI spadnout (jinak by cervena prehlusila skutecnou
      # vadu). Vada (exit 1) ale shodi krok VZDY a NEMERENO zustava videt jako
      # warning i v artefaktu summary.json.
      - name: Brány v závazném pořadí (G1 → G3 → G5 → … → G10)
        env:
          GODOT: ${{ env.GODOT_BIN }}
        run: |
          set +e
          python tools/gates/run-all.py
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Brány: část zůstala NEMĚŘENO (exit 2) - v CI bez assets/uo jde o G6 a G10; NENÍ to zelená"
            exit 0
          fi
          exit "$rc"

      # Mutacni dukaz: vraci do kódu vadu a test ji musi chytit. Bez tohoto
      # kroku je "0 selhani" jen tvrzeni - namEReno 2026-10-06: case soubor
      # s parse errory se v harnessu TISE preskoci a sada hlasi 0 selhani.
      - name: Mutační důkaz testů (tests/cases opravdu měří)
        env:
          GODOT: ${{ env.GODOT_BIN }}
        run: python tools/gates/mutace-tests.py

      # Mutační důkaz DATA (skills.json) - běží kdekoli, protože vstup je v gitu.
      # POZOR: i tenhle krok potřebuje `env: GODOT` (harness pouští testovací
      # sadu v Godotu) - bez něj spadne na "Godot nenalezen (nastav $GODOT)".
      # Naměřeno 2026-10-06: přesně to shodilo běh #17 (krok bez env).
      # POZOR 2: `mutace-anim.py` a `mutace-render-anim.py` v CI běžet NEMOHOU -
      # první chce instalaci UO (`D:\Games\...`), druhý `assets/uo/anim/*.png`
      # (obojí je gitignore). Pouští se lokálně; kdo je bude chtít v CI, musí
      # jim dát fixture.
      - name: Mutační důkaz dat (data/skills.json)
        env:
          GODOT: ${{ env.GODOT_BIN }}
        run: python tools/gates/mutace-skills.py

      # Stav plánu je MĚŘENÝ (soubor v gitu + test), ne deklarovaný v roadmapě.
      # `--check` spadne jen na rozporu "done: true, ale neměřeno" (dnes 0).
      - name: Stav plánu (měřený, ne deklarovaný)
        run: python tools/plan-status.py --check

      - name: Souhrn bran do přehledu běhu
        if: always()
        run: |
          if [ -f .cache/gates/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .cache/gates/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Souhrn bran nevznikl - brány NEPROBĚHLY' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Artefakty (souhrn bran + snímek)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates
          path: |
            .cache/gates/
            .cache/render/
          if-no-files-found: warn
          retention-days: 14
